[project]
name = "bluestar-mcp-shared"
version = "0.2.0"
description = "Shared authentication middleware for Bluestar MCP servers"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40.0",
    "pyjwt[crypto]>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bluestar_mcp_shared"]
