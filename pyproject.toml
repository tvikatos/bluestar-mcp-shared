[project]
name = "bluestar-mcp-shared"
version = "0.5.0"
description = "Shared code for Bluestar MCP servers: auth middleware, Neo4j drivers and retry, PropertyDef type checking"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40.0",
    "pyjwt[crypto]>=2.8.0",
    "neo4j>=5.16,<6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bluestar_mcp_shared"]
